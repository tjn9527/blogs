baseURL = 'https://tjn9527.github.io/blogs/'
# 语言：defaultContentLanguage 决定 <html lang> 与 i18n 查找的 key（zh-cn → i18n/zh-cn.yaml）；
# locale 是 v0.158 起替代 languageCode 的新键（RSS <language>、日期/数字本地化）。
# 注意：只写 locale 时 <html lang> 会是 en，必须同时写 defaultContentLanguage。
defaultContentLanguage = 'zh-cn'
locale = 'zh-cn'
title = "Andy's Tech Blog"
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = true

# 首页额外输出 index.json —— PaperMod 搜索页的索引数据源。
# 缺这一项时构建产物里没有 index.json，搜索页的 fetch('../index.json') 报 404，
# 搜索框会一直停留在 disabled 状态（看起来像"搜索坏了"）。
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowLastMod = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  description = 'Python 后端工程师的个人技术博客'

  # 搜索（Fuse.js）参数。PaperMod 默认 threshold=0.4 对中文太宽松：实测查"数据库"
  # 会先返回《你好，世界》（正文只有"数据工程"），而真正讲数据库的 MySQL 笔记排最后。
  # threshold=0.25 后"数据库"只返回 MySQL 笔记，"数据"/"刷题"/"b+树"等仍正常命中。
  # 注意：fastsearch.js 里多词参数读全小写键名（iscasesensitive、minmatchcharlength…），
  # 只写单词键名才生效。
  [params.fuseOpts]
    threshold = 0.25
    ignorelocation = true
    keys = ['title', 'permalink', 'summary', 'content']

  [params.homeInfoParams]
    Title = "Hi, I'm Andy 👋"
    Content = "Python 后端工程师，记录技术学习、项目实践与思考。"

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/tjn9527'

[[params.socialIcons]]
  name = 'linkedin'
  url = 'https://www.linkedin.com/in/andytang9905'

